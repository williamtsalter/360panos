<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mulgate Creek Driveway East | Llara Farm 360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    html, body { width:100%; height:100%; margin:0; font-family:sans-serif; }
    #panorama { width:100%; height:92%; }
    #label {
      background:#2c6e49; color:white;
      padding:8px 16px; font-size:14px;
      display:flex; justify-content:space-between; align-items:center;
    }
    #label a { color:#ccc; font-size:12px; text-decoration:none; }
  </style>
</head>
<body>
  <div id="label">
    <span>📍 Site 2 — Mulgate Creek Driveway East</span>
    ../index.html
  </div>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      type: 'multires',
      autoLoad: true,
      multiRes: {
        basePath: 'tiles',
        path: '/%l/%s%y_%x',
        fallbackPath: '/fallback/%s',
        extension: 'jpg',
        tileResolution: 512,
        maxLevel: 6,
        cubeResolution: 10408
      }
    });
  </script>
</body>
</html>
